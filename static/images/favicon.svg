<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Pastel Pink Background for high contrast in browser tab -->
  <rect width="64" height="64" rx="16" fill="#FFF0F4" />
  
  <!-- Cake Base Plate -->
  <rect x="10" y="50" width="44" height="4" rx="2" fill="#E892A8" />
  
  <!-- Bottom Tier -->
  <rect x="14" y="34" width="36" height="16" rx="4" fill="#FFE2E9" stroke="#D15378" stroke-width="2.5" />
  <!-- Icing Drips on Bottom Tier -->
  <path d="M14 38 C18 42, 22 35, 26 39 C30 43, 34 35, 38 39 C42 43, 46 36, 50 38" stroke="#D15378" stroke-width="2.5" fill="none" stroke-linecap="round" />
  
  <!-- Top Tier -->
  <rect x="20" y="20" width="24" height="14" rx="3.5" fill="#FFFFFF" stroke="#D15378" stroke-width="2.5" />
  <!-- Icing Drips on Top Tier -->
  <path d="M20 24 C24 27, 28 22, 32 25 C36 28, 40 23, 44 25" stroke="#D15378" stroke-width="2.2" fill="none" stroke-linecap="round" />
  
  <!-- Candle -->
  <line x1="32" y1="11" x2="32" y2="19" stroke="#D15378" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Golden Flame -->
  <path d="M32 4 C29 8, 29 10, 32 11 C35 10, 35 8, 32 4 Z" fill="#F59E0B" />
  <circle cx="32" cy="8.5" r="1.5" fill="#FDE68A" />
  
  <!-- Cute Little Heart Accent -->
  <path d="M47 13 C48 11.5, 50 12, 50.5 13.5 C51 15, 49 16.5, 47 18 C45 16.5, 43 15, 43.5 13.5 C44 12, 46 11.5, 47 13 Z" fill="#E0698B" />
</svg>
