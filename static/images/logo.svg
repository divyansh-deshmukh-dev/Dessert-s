<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Cake Icon -->
  <g transform="translate(4, 6)">
    <!-- Base Plate -->
    <rect x="4" y="44" width="40" height="3" rx="1.5" fill="#E892A8" />
    
    <!-- Bottom Tier -->
    <rect x="8" y="30" width="32" height="13" rx="3" fill="#FFE3EA" stroke="#D15378" stroke-width="2" />
    <path d="M8 33 C12 36, 16 30, 20 33 C24 36, 28 30, 32 33 C36 36, 40 33, 40 33" stroke="#D15378" stroke-width="1.8" fill="none" stroke-linecap="round" />
    
    <!-- Top Tier -->
    <rect x="13" y="18" width="22" height="11" rx="2.5" fill="#FFF0F4" stroke="#D15378" stroke-width="2" />
    <path d="M13 21 C16 23, 19 19, 22 21 C25 23, 28 20, 31 22 C34 23, 35 21, 35 21" stroke="#D15378" stroke-width="1.6" fill="none" stroke-linecap="round" />
    
    <!-- Candle -->
    <line x1="24" y1="11" x2="24" y2="17" stroke="#D15378" stroke-width="2" stroke-linecap="round" />
    
    <!-- Flame -->
    <path d="M24 6 C22 9, 22 10.5, 24 11 C26 10.5, 26 9, 24 6 Z" fill="#FBBF24" />
    
    <!-- Sparkles / Hearts -->
    <path d="M43 14 C44 12, 46 13, 46.5 14.5 C47 16, 45 17.5, 43 19 C41 17.5, 39 16, 39.5 14.5 C40 13, 42 12, 43 14 Z" fill="#E0698B" transform="scale(0.5) translate(38, 5)" />
  </g>

  <!-- Typography -->
  <text x="56" y="32" font-family="'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" fill="#3D1822" letter-spacing="-0.5">Dessert's</text>
  <path d="M165 24 C167 21, 171 22, 172 24.5 C173 27, 170 29.5, 165 33 C160 29.5, 157 27, 158 24.5 C159 22, 163 21, 165 24 Z" fill="#D15378" transform="scale(0.65) translate(80, 2)" />
  
  <text x="57" y="47" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10" font-weight="500" fill="#9C6B78" letter-spacing="0.5">Bakery Order Tracker</text>
</svg>
